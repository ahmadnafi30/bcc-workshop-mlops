vars:
  - params.json

stages:
  build_training_features:
    desc: Build a separate feature file for the configured training period.
    cmd: >-
      python scripts/build_features.py
      --start-date ${data.history_start}
      --end-date ${data.training_cutoff}
      --output-path data/features/training/taxi_demand_features.csv
      --force
    deps:
      - data/processed/demand
      - scripts/build_features.py
      - src/features/dataset.py
      - src/features/build_features.py
      - src/data_versioning/pipeline_files.py
      - pyproject.toml
      - uv.lock
    params:
      - params.json:
          - data.history_start
          - data.training_cutoff
    outs:
      - data/features/training/taxi_demand_features.csv

  create_training_snapshot:
    desc: Freeze training features into a dated, versioned snapshot.
    cmd: >-
      python scripts/create_training_snapshot.py
      --cutoff-date ${data.training_cutoff}
      --feature-path data/features/training/taxi_demand_features.csv
    deps:
      - data/features/training/taxi_demand_features.csv
      - scripts/create_training_snapshot.py
      - src/data_versioning/snapshot.py
      - src/data_versioning/pipeline_files.py
    params:
      - params.json:
          - data.training_cutoff
    outs:
      - data/snapshots/training/taxi_demand_${data.training_cutoff}.csv
