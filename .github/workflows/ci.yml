name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "fix/**"
      - "docs/**"
      - "chore/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request direction
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ "$BASE_BRANCH" = "main" ] && [ "$HEAD_BRANCH" != "develop" ]; then
            echo "PR ke main harus berasal dari develop."
            exit 1
          fi

          if [ "$BASE_BRANCH" = "develop" ]; then
            case "$HEAD_BRANCH" in
              feat/*|fix/*|docs/*|chore/*) ;;
              *)
                echo "PR ke develop harus berasal dari feat/*, fix/*, docs/*, atau chore/*."
                exit 1
                ;;
            esac
          fi

  quality:
    name: Python + docs quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Check lock file
        run: uv lock --check

      - name: Sync project
        run: uv sync --group docs

      - name: Run Ruff
        run: uv run ruff check src api scripts tests

      - name: Run tests
        run: uv run pytest -q

      - name: Build workshop docs
        run: uv run --group docs mkdocs build --strict

  docker-build:
    name: Docker build - ${{ matrix.target }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target:
          - api
          - mlflow
          - airflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate Compose config
        run: docker compose config --quiet

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          tags: bcc-workshop-mlops-${{ matrix.target }}:ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
