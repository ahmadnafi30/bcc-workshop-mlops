name: bcc-workshop-mlops

services:
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-taxi-demand-forecasting}
      MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-taxi-demand-forecasting-model}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: airflow
    environment:
      AIRFLOW_HOME: /airflow
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__API__HOST: 0.0.0.0
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-taxi-demand-forecasting}
      MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-taxi-demand-forecasting-model}
      RETRAIN_MAE_MULTIPLIER: ${RETRAIN_MAE_MULTIPLIER:-1.25}
      RETRAIN_MIN_SAMPLES: ${RETRAIN_MIN_SAMPLES:-100}
      RETRAIN_RECENT_LIMIT: ${RETRAIN_RECENT_LIMIT:-500}
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
      - airflow-home:/airflow
      - dvc-cache:/app/.dvc/cache
    depends_on:
      mlflow:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  workspace:
    profiles:
      - tools
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-taxi-demand-forecasting}
      MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-taxi-demand-forecasting-model}
    volumes:
      - ./data:/app/data
      - dvc-cache:/app/.dvc/cache

volumes:
  mlflow-data:
  airflow-home:
  dvc-cache:
  prometheus-data:
  grafana-data:
