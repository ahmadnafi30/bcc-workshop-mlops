name: bcc-workshop-mlops

services:
  mlflow:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mlflow
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - ./.mlflow:/mlflow
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-taxi-demand-forecasting}
      MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-taxi-demand-forecasting-model}
      MODEL_ALIAS: ${MODEL_ALIAS:-champion}
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  airflow:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: airflow
    environment:
      AIRFLOW_HOME: /airflow
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__API__HOST: 0.0.0.0
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
      AIRFLOW__API__WORKERS: "1"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-taxi-demand-forecasting}
      MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-taxi-demand-forecasting-model}
      RETRAIN_MAE_MULTIPLIER: ${RETRAIN_MAE_MULTIPLIER:-1.25}
      RETRAIN_MIN_SAMPLES: ${RETRAIN_MIN_SAMPLES:-100}
      RETRAIN_RECENT_LIMIT: ${RETRAIN_RECENT_LIMIT:-500}
    ports:
      - "${AIRFLOW_PORT:-127.0.0.1:8080}:8080"
    volumes:
      - ./data:/app/data
      - ./dags:/app/dags:ro
      - airflow-home:/airflow
      - dvc-cache:/app/.dvc/cache
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          health = json.load(urllib.request.urlopen('http://127.0.0.1:8080/api/v2/monitor/health', timeout=5));
          assert all(health.get(component, {}).get('status') == 'healthy' for component in ('metadatabase', 'scheduler', 'triggerer', 'dag_processor'))
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "${SERVICE_BIND_HOST:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      prometheus:
        condition: service_healthy

  workspace:
    profiles:
      - tools
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: base
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-taxi-demand-forecasting}
      MLFLOW_REGISTERED_MODEL_NAME: ${MLFLOW_REGISTERED_MODEL_NAME:-taxi-demand-forecasting-model}
    volumes:
      - ./data:/app/data
      - dvc-cache:/app/.dvc/cache

volumes:
  airflow-home:
  dvc-cache:
  prometheus-data:
  grafana-data:
