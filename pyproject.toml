[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcc-workshop-mlops"
version = "0.1.0"
description = "Beginner-friendly end-to-end MLOps workshop using NYC taxi demand forecasting"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dvc>=3.60,<4.0",
    "fastapi>=0.115,<1.0",
    "joblib>=1.4",
    "mlflow>=3.5,<4.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "prometheus-client>=0.22,<1.0",
    "pyarrow>=17.0",
    "requests>=2.32",
    "scikit-learn>=1.6,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1.0",
    "jupyterlab>=4.2",
    "pytest>=8.3",
    "ruff==0.16.10",
]
airflow = [
    "apache-airflow==3.3.2",
]
docs = [
    "mkdocs-material==9.7.7",
]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
