[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcc-workshop-mlops"
version = "0.1.0"
description = "End-to-end MLOps workshop project for BCC"
requires-python = ">=3.11"
dependencies = [
    "dvc>=3.60,<4.0",
    "joblib>=1.4",
    "mlflow>=3.5,<4.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "requests>=2.32",
    "scikit-learn>=1.6,<2.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.2",
    "pytest>=8.3",
]
airflow = [
    "apache-airflow==3.3.2",
]

[tool.uv]
default-groups = ["dev"]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
